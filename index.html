<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FEFAF3;--brown:#3D2410;--brown-mid:#7B4F2E;--brown-light:#B8895A;
  --tan:#EAD8BB;--tan-light:#F5ECD8;--red:#B83020;--card:#FFFDF8;--border:#E0C99A;
}
html,body{background:var(--cream)}
body{font-family:'Nunito',sans-serif;color:var(--brown);min-height:100vh;max-width:480px;margin:0 auto;position:relative}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px}
.loading-bear{font-size:52px;animation:bob .9s ease-in-out infinite alternate}
.loading-text{font-size:13px;font-weight:700;color:var(--brown-light);letter-spacing:.5px}
@keyframes bob{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-12px) rotate(5deg)}}

/* HEADER */
header{background:var(--cream);border-bottom:1.5px solid var(--tan);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center}
.logo-img{height:46px;width:auto;display:block}
.logo-icon{width:34px;height:34px;background:var(--brown);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-name{font-size:14px;font-weight:900;color:var(--brown);letter-spacing:-.3px;line-height:1.1}
.logo-sub{font-size:8px;font-weight:700;color:var(--brown-light);letter-spacing:2px;text-transform:uppercase}
.fb-btn{background:var(--brown);color:#fff;border:none;border-radius:20px;padding:7px 13px;font-size:11px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.fb-btn:hover{background:var(--red)}

/* HERO */
.hero{padding:24px 20px 18px;text-align:center;background:linear-gradient(180deg,#FDF3E3 0%,var(--cream) 100%)}
.hero-dots{display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:10px}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.hero-dot.lg{width:8px;height:8px}
.hero h1{font-size:24px;font-weight:900;color:var(--brown);line-height:1.15;margin-bottom:6px;letter-spacing:-.5px}
.hero h1 em{font-style:italic;font-family:'Playfair Display',serif;font-weight:400;color:var(--brown-mid)}
.hero p{font-size:12px;color:var(--brown-mid);line-height:1.6;max-width:280px;margin:0 auto}

/* SEARCH */
.search-wrap{padding:10px 14px 0;position:relative}
.search-input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:9px 14px 9px 36px;font-size:13px;font-family:'Nunito',sans-serif;color:var(--brown);outline:none}
.search-input:focus{border-color:var(--brown-light)}
.search-ico{position:absolute;left:26px;top:50%;transform:translateY(-30%);font-size:14px;pointer-events:none}

/* FILTERS */
.filters{background:var(--cream);position:sticky;top:68px;z-index:40;border-bottom:1px solid var(--tan);padding-bottom:4px}
.filter-lbl{font-size:9px;font-weight:800;color:var(--brown-light);letter-spacing:2px;text-transform:uppercase;padding:6px 16px 2px;display:block}
.chip-row{display:flex;gap:5px;padding:0 14px 6px;overflow-x:auto;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:transparent;border:1.5px solid var(--border);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;font-family:'Nunito',sans-serif;color:var(--brown-mid);cursor:pointer;white-space:nowrap;transition:all .12s;user-select:none}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.chip:active{transform:scale(.95)}

/* RESULTS */
.results-bar{padding:8px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.results-count{font-size:11px;font-weight:700;color:var(--brown-light)}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 11px 80px}

/* CARD */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.97)}
.card-img{aspect-ratio:1;background:var(--tan-light);position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.card-img img.show{opacity:1}
.card-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;position:absolute;inset:0}
.size-tag{position:absolute;top:6px;left:6px;background:rgba(255,253,248,.93);border:1px solid var(--border);border-radius:8px;padding:2px 7px;font-size:9px;font-weight:800;color:var(--brown-mid)}
.card-body{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:3px}
.card-cat{font-size:9px;font-weight:800;color:var(--brown-light);letter-spacing:1px;text-transform:uppercase}
.card-name{font-size:11px;font-weight:700;color:var(--brown);line-height:1.3;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price-tag{align-self:flex-start;background:var(--tan-light);border:1px solid var(--border);border-radius:8px;padding:2px 7px;font-size:10px;font-weight:800;color:var(--brown-mid);margin-top:2px}
.ask-btn{margin-top:6px;width:100%;background:var(--brown);color:#fff;border:none;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:background .12s;letter-spacing:.2px}
.ask-btn:active{background:var(--red)}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--brown-light);font-size:13px;font-weight:700}


/* FOOTER */
footer{background:var(--brown);color:var(--tan);text-align:center;padding:20px 16px;font-size:12px;line-height:1.9}
footer a{color:#F5ECD8;font-weight:800;text-decoration:none}
</style>

<body>

<div id="loading">
  <div class="loading-bear">🐻</div>
  <div class="loading-text">Đang tải sản phẩm...</div>
</div>

<header>
  <div class="logo"><img class="logo-img" src="logo.png" alt="The Fluffy Cuddles"></div>
  <a class="fb-btn" href="https://www.facebook.com/thefluffycuddles/" target="_blank" onclick="trackContact('header_nhan_tin')">Nhắn tin →</a>
</header>

<section class="hero">
  <div class="hero-dots">
    <div class="hero-dot"></div><div class="hero-dot lg"></div><div class="hero-dot"></div>
  </div>
  <h1>Jellycat <em>chính hãng</em><br>tại Việt Nam</h1>
  <p>Có sẵn ship liền · Tặng kèm Dust Bag 🐾</p>
</section>

<div class="search-wrap">
  <span class="search-ico">🔍</span>
  <input class="search-input" type="text" placeholder="Tìm tên sản phẩm..." id="search">
</div>

<div class="filters">
  <span class="filter-lbl">Loại</span>
  <div class="chip-row" id="tag-chips">
    <button class="chip on" data-val="all">Tất cả</button>
    <button class="chip" data-val="Bunnies">🐰 Bunnies</button>
    <button class="chip" data-val="Bear">🐻 Bears</button>
    <button class="chip" data-val="Dragon">🐲 Dragons</button>
    <button class="chip" data-val="Amuseables">🍩 Amuseables</button>
    <button class="chip" data-val="Smudge">🐼 Smudge</button>
    <button class="chip" data-val="Fuddlewuddle">🦁 Fuddlewuddle</button>
    <button class="chip" data-val="Puppy">🐶 Puppy</button>
    <button class="chip" data-val="Other Animals">🦆 Others</button>
    <button class="chip" data-val="Musical Pull">🎵 Musical</button>
    <button class="chip" data-val="Bag Charm">✨ Charm</button>
  </div>
  <span class="filter-lbl">Size</span>
  <div class="chip-row" id="size-chips">
    <button class="chip on" data-val="all">Tất cả</button>
    <button class="chip" data-val="Small">Small</button>
    <button class="chip" data-val="Medium">Medium</button>
    <button class="chip" data-val="Large">Large</button>
    <button class="chip" data-val="Huge">Huge</button>
    <button class="chip" data-val="Really Big">Really Big</button>
  </div>
  <span class="filter-lbl">Giá</span>
  <div class="chip-row" id="price-chips">
    <button class="chip on" data-val="all">Tất cả</button>
    <button class="chip" data-val="Dưới 1 triệu">Dưới 1tr</button>
    <button class="chip" data-val="1 – 2 triệu">1–2 triệu</button>
    <button class="chip" data-val="2 – 3 triệu">2–3 triệu</button>
    <button class="chip" data-val="3 – 4 triệu">3–4 triệu</button>
    <button class="chip" data-val="4 – 5 triệu">4–5 triệu</button>
    <button class="chip" data-val="Trên 5 triệu">5tr+</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<footer>
  <strong>The Fluffy Cuddles</strong> · Soft Care Service<br>
  <a href="https://www.facebook.com/thefluffycuddles/" target="_blank" onclick="trackContact('footer_messenger')">Facebook / Messenger</a>
  &nbsp;·&nbsp; Jellycat chính hãng tại Việt Nam
</footer>


<script>
const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMJSxl6mo7K9MSdVA5OmxVy1HyV4UGP8CVzoOVlGEsCLEzTKimv4EtWspzPyxcf2kcknaQ8eTTtrWQ/pub?gid=1138333654&single=true&output=csv&t=' + Date.now();
const GITHUB_RAW = 'https://raw.githubusercontent.com/nhlong2990-rgb/fluffy-cuddles/main/';
const FB = 'https://www.facebook.com/thefluffycuddles/';
const EMOJI = {Bunnies:'🐰',Bear:'🐻',Dragon:'🐲','Other Animals':'🦆',Amuseables:'🍩',Smudge:'🐼',Fuddlewuddle:'🦁',Puppy:'🐶','Musical Pull':'🎵','Bag Charm':'✨',Toy:'🎁'};

let ALL = [], filtered = [];
let fTag='all', fSize='all', fPrice='all', fSearch='';

// Parse CSV — handle quoted fields
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = splitCSVLine(lines[0]);
  const tagIdx=0,prodIdx=1,sizeIdx=2,priceIdx=4; // Tag,Product,Size,Giábán,Khoảnggiá
  const seen = new Set();
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const c = splitCSVLine(lines[i]);
    const tag=(c[tagIdx]||'').trim();
    const prod=(c[prodIdx]||'').trim();
    const size=(c[sizeIdx]||'').trim();
    const price=(c[priceIdx]||'').trim();

    if(!prod||prod==='Product') continue;
    // Dedup by product+size
    const key=(prod+'|'+size).toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    rows.push({tag,prod,size,price});
  }
  return rows;
}

function splitCSVLine(line){
  const result=[];
  let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){inQ=!inQ;}
    else if(line[i]===','&&!inQ){result.push(cur);cur='';}
    else cur+=line[i];
  }
  result.push(cur);
  return result;
}

function getFiltered(){
  return ALL.filter(p=>{
    if(fTag!=='all'&&p.tag!==fTag) return false;
    if(fSize!=='all'&&p.size!==fSize) return false;
    if(fPrice!=='all'&&p.price!==fPrice) return false;
    if(fSearch&&!p.prod.toLowerCase().includes(fSearch)) return false;
    return true;
  });
}

function render(){
  filtered = getFiltered();
  const grid = document.getElementById('grid');
  if(!filtered.length){
    grid.innerHTML='<div class="empty">Không tìm thấy sản phẩm 🐾</div>';
    return;
  }
  grid.innerHTML = filtered.map((p,i)=>{
    const em = EMOJI[p.tag]||'🧸';
    const sizeLow = (p.size||'').toLowerCase();
    const src1 = GITHUB_RAW + encImg(sizeLow ? p.prod+' '+sizeLow+'.webp' : p.prod+'.webp');
    const src2 = GITHUB_RAW + encImg(sizeLow ? p.prod+' '+sizeLow+'.jpg' : p.prod+'.jpg');
    const src3 = GITHUB_RAW + encImg(p.prod+'.webp');
    const src4 = GITHUB_RAW + encImg(p.prod+'.jpg');
    return `<div class="card">
      <div class="card-img">
        <div class="card-ph" id="ph-${i}">${em}</div>
        <img src="${src1}"
          onload="this.classList.add('show');this.previousElementSibling.style.display='none'"
          onerror="
            var s=this;
            if(s._t===undefined)s._t=0;
            var fb=['${src2}','${src3}','${src4}'];
            if(s._t<fb.length){s.src=fb[s._t++];}
            else{s.style.display='none';}
          ">
        <span class="size-tag">${p.size||'–'}</span>
      </div>
      <div class="card-body">
        <div class="card-cat">${p.tag}</div>
        <div class="card-name">${p.prod}</div>
        <span class="price-tag">${p.price}</span>
        <button class="ask-btn" onclick="event.stopPropagation();ask(${i})">Nhận nuôi →</button>
      </div>
    </div>`;
  }).join('');
}

function imgLoaded(imgId, phId){
  const img=document.getElementById(imgId);
  const ph=document.getElementById(phId);
  if(img){img.classList.add('show')}
  if(ph){ph.style.display='none'}
}


// Encode file name for URL (also encode ' so names like 'Bloom' don't break)
function encImg(name){
  return encodeURIComponent(name).replace(/'/g,'%27');
}

// TikTok: track "Contact" when a customer clicks to message the shop
function trackContact(source, p){
  try{
    if(!window.ttq) return;
    const data = {description: source};
    if(p){
      data.content_type = 'product';
      data.contents = [{
        content_id: p.prod + (p.size ? ' ' + p.size : ''),
        content_name: p.prod,
        content_category: p.tag
      }];
    }
    ttq.track('Contact', data);
  }catch(e){}
}

function ask(i){
  trackContact('hoi_mua', filtered[i]);
  window.open(FB,'_blank');
}

// Filter wiring
function wireChips(rowId, setter){
  document.getElementById(rowId).addEventListener('click',e=>{
    const c=e.target.closest('.chip');if(!c)return;
    setter(c.dataset.val);
    document.querySelectorAll('#'+rowId+' .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    render();
  });
}
wireChips('tag-chips', v=>fTag=v);
wireChips('size-chips', v=>fSize=v);
wireChips('price-chips', v=>fPrice=v);

document.getElementById('search').addEventListener('input',e=>{
  fSearch=e.target.value.toLowerCase().trim();
  render();
});

// Load CSV
async function loadData(){
  const CSV_URL = 'https://raw.githubusercontent.com/nhlong2990-rgb/fluffy-cuddles/main/products.csv';
  try{
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    ALL = parseCSV(text);
  }catch(e){
    console.log('CSV error:', e.message);
    ALL = [];
  }
  document.getElementById('loading').style.display='none';
  render();
}

loadData();
</script>
</body>
